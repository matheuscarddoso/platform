# Reusable workflow: build a Next.js app on GitHub-hosted runners, ship it as
# an immutable image to GHCR and roll it out through Coolify on the platform
# server (health-checked, zero-downtime).
#
# Why it is fast:
#   - node_modules and .next/cache are restored from cache, so a typical push
#     only recompiles what changed;
#   - the build runs natively on the runner (no Docker build stage); the image
#     is a single COPY on top of a base the server already has, so push and
#     pull move only the app layer;
#   - the server never builds, it only swaps containers.
#
# Usage (in the app repository): see templates/deploy.yml.
name: Deploy Next.js

on:
  workflow_call:
    inputs:
      deploy-host:
        description: Server hostname or IP address.
        type: string
        required: true
      known-hosts:
        description: Pinned SSH host key line for deploy-host (never trust on first use in CI).
        type: string
        required: true
      node-version:
        description: Node.js major version. Defaults to .nvmrc / .node-version, then 24.
        type: string
        default: ''
      working-directory:
        description: Directory holding package.json and the lockfile.
        type: string
        default: .
      environment-url:
        description: Public URL shown on the GitHub deployment.
        type: string
        default: ''
    secrets:
      deploy-ssh-key:
        description: Per-repository deploy key bound to this app on the server.
        required: true
      build-env:
        description: dotenv-formatted variables exposed only to the build step (e.g. NEXT_PUBLIC_*).
        required: false

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: ${{ inputs.environment-url }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WD: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect toolchain
        id: tc
        env:
          NODE_INPUT: ${{ inputs.node-version }}
        run: |
          set -euo pipefail
          node="$NODE_INPUT"
          if [[ -z "$node" ]]; then
            for f in .nvmrc .node-version; do
              if [[ -f "$f" ]]; then node="$(tr -d ' \r\nv' < "$f")"; break; fi
            done
          fi
          node="${node%%.*}"
          [[ "$node" =~ ^[0-9]+$ ]] || node=24

          if   [[ -f pnpm-lock.yaml ]];        then pm=pnpm; lock=pnpm-lock.yaml
          elif [[ -f bun.lock ]];              then pm=bun;  lock=bun.lock
          elif [[ -f bun.lockb ]];             then pm=bun;  lock=bun.lockb
          elif [[ -f yarn.lock ]];             then pm=yarn; lock=yarn.lock
          elif [[ -f package-lock.json ]];     then pm=npm;  lock=package-lock.json
          else echo "::error::No lockfile found in $WD"; exit 1; fi

          {
            echo "node=$node"
            echo "pm=$pm"
            echo "lock=$WD/$lock"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
          echo "Node $node · $pm · $lock"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.tc.outputs.node }}
          package-manager-cache: false

      - name: Setup Bun
        if: steps.tc.outputs.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Enable Corepack
        if: steps.tc.outputs.pm == 'pnpm' || steps.tc.outputs.pm == 'yarn'
        run: |
          command -v corepack >/dev/null || npm install -g corepack@latest --no-audit --no-fund
          corepack enable

      - name: Restore node_modules
        id: nm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: nm-${{ runner.os }}-node${{ steps.tc.outputs.node }}-${{ hashFiles(steps.tc.outputs.lock, format('{0}/package.json', inputs.working-directory), format('{0}/**/schema.prisma', inputs.working-directory)) }}

      - name: Install dependencies
        if: steps.nm.outputs.cache-hit != 'true'
        env:
          PM: ${{ steps.tc.outputs.pm }}
        run: |
          case "$PM" in
            npm)  npm ci --no-audit --no-fund ;;
            pnpm) pnpm install --frozen-lockfile ;;
            bun)  bun install --frozen-lockfile ;;
            yarn) if [[ -f .yarnrc.yml ]]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
          esac

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles(steps.tc.outputs.lock) }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles(steps.tc.outputs.lock) }}-
            next-${{ runner.os }}-

      - name: Build
        env:
          PM: ${{ steps.tc.outputs.pm }}
          BUILD_ENV: ${{ secrets.build-env }}
        run: |
          set -euo pipefail
          if [[ -n "${BUILD_ENV:-}" ]]; then
            # Turn the dotenv secret into masked, safely quoted exports for this
            # step only. Nothing is written to disk, so it can never end up in
            # the image.
            cat > "$RUNNER_TEMP/env2sh.cjs" <<'JS'
          const { parseEnv } = require("node:util");
          const q = (s) => `'${String(s).replace(/'/g, `'\\''`)}'`;
          for (const [k, v] of Object.entries(parseEnv(process.env.BUILD_ENV))) {
            if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(k)) continue;
            for (const line of String(v).split("\n")) if (line.length >= 4) console.log(`echo ${q("::add-mask::" + line)}`);
            console.log(`export ${k}=${q(v)}`);
          }
          JS
            eval "$(node "$RUNNER_TEMP/env2sh.cjs")"
            rm -f "$RUNNER_TEMP/env2sh.cjs"
          fi
          unset BUILD_ENV
          "$PM" run build

      - name: Package image context
        id: pkg
        run: |
          set -euo pipefail
          if [[ ! -d .next/standalone ]]; then
            echo "::error::.next/standalone not found. Set output: 'standalone' in next.config."
            exit 1
          fi
          # In monorepos server.js is nested under the tracing root.
          server="$(cd .next/standalone && find . -name server.js -not -path '*/node_modules/*' -printf '%d %p\n' | sort -n | head -1 | cut -d' ' -f2)"
          [[ -n "$server" ]] || { echo "::error::server.js not found in .next/standalone"; exit 1; }
          appdir="$(dirname "${server#./}")"

          ctx="$RUNNER_TEMP/image"
          rm -rf "$ctx" && mkdir -p "$ctx"
          cp -a .next/standalone "$ctx/app"
          mkdir -p "$ctx/app/$appdir/.next"
          cp -a .next/static "$ctx/app/$appdir/.next/static"
          if [[ -d public ]]; then cp -a public "$ctx/app/$appdir/public"; fi

          cat > "$ctx/Dockerfile" <<'DOCKERFILE'
          ARG NODE_MAJOR=24
          FROM busybox:1.38-musl AS busybox
          FROM node:${NODE_MAJOR}-slim
          ARG APP_DIR=.
          ENV NODE_ENV=production \
              PORT=3000 \
              HOSTNAME=0.0.0.0 \
              NEXT_TELEMETRY_DISABLED=1
          # Static wget (~1 MB) for health checks; avoids an apt layer per image.
          COPY --from=busybox /bin/busybox /usr/local/bin/wget
          COPY --chown=node:node app /srv
          WORKDIR /srv/${APP_DIR}
          USER node
          EXPOSE 3000
          HEALTHCHECK --interval=10s --timeout=3s --start-period=15s --retries=3 \
            CMD ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
          CMD ["node", "server.js"]
          DOCKERFILE

          echo "ctx=$ctx" >> "$GITHUB_OUTPUT"
          echo "appdir=$appdir" >> "$GITHUB_OUTPUT"
          du -sh "$ctx/app"

      - name: Build & push image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.tc.outputs.image }}
          TAG: ${{ steps.tc.outputs.tag }}
          NODE_MAJOR: ${{ steps.tc.outputs.node }}
          CTX: ${{ steps.pkg.outputs.ctx }}
          APP_DIR: ${{ steps.pkg.outputs.appdir }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build "$CTX" --pull \
            --build-arg NODE_MAJOR="$NODE_MAJOR" \
            --build-arg APP_DIR="$APP_DIR" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:$TAG" -t "$IMAGE:main"
          docker push --all-tags "$IMAGE"

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.deploy-ssh-key }}
          KNOWN_HOSTS: ${{ inputs.known-hosts }}
          HOST: ${{ inputs.deploy-host }}
          TAG: ${{ steps.tc.outputs.tag }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 \
              "deploy@$HOST" "deploy $TAG"
          rm -f ~/.ssh/deploy_key

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.tc.outputs.image }}
          TAG: ${{ steps.tc.outputs.tag }}
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
          URL: ${{ inputs.environment-url }}
          STATUS: ${{ job.status }}
        run: |
          elapsed=""
          if [[ "$PUSHED_AT" =~ ^[0-9]+$ ]]; then elapsed="$(( $(date +%s) - PUSHED_AT ))s from push to live"; fi
          {
            echo "### Deploy ${STATUS}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE:$TAG\` |"
            [[ -n "$URL" ]] && echo "| URL | $URL |"
            [[ -n "$elapsed" ]] && echo "| Time | $elapsed |"
          } >> "$GITHUB_STEP_SUMMARY"
