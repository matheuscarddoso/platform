name: Runtime image

on:
  push:
    branches: [main]
    paths: [runtime/**, .github/workflows/runtime-image.yml]
  schedule:
    - cron: '0 6 * * 1' # Mondays 03:00 BRT: pick up OS and Node.js patches
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: node${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build & push
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nextjs-runtime"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build runtime --pull --push \
            --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg NODE_MAJOR="$NODE_MAJOR" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.description="Next.js standalone runtime (Node.js $NODE_MAJOR)" \
            -t "$image:node$NODE_MAJOR" \
            -t "$image:node$NODE_MAJOR-$(date -u +%Y%m%d)"
