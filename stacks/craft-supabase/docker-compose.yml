# Self-hosted Supabase for craft: database, auth (e-mail codes), REST and storage.
#
# Derived from stacks/kubofood-supabase, same pinned versions. Left out because craft does
# not use them: realtime, Studio and meta. Nothing is published on the host; the internet
# reaches the gateway only through Traefik, on the API paths only (see labels).
# Secrets live in .env on the server (generated by deploy.sh, mode 0600).

name: craft-supabase

x-defaults: &defaults
  restart: unless-stopped

services:
  api-gw:
    <<: *defaults
    container_name: craft-sb-gateway
    image: envoyproxy/envoy:v1.39.1
    mem_limit: 128m
    networks:
      default:
        aliases: [envoy, kong]
      coolify: {}
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      rest:
        condition: service_started
      auth:
        condition: service_started
      storage:
        condition: service_started
    volumes:
      - ./volumes/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./volumes/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./volumes/api/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./volumes/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      # Public surface: the client APIs only. Studio (/), meta (/pg) and the
      # MCP endpoints are never routed from the internet.
      traefik.http.routers.craft-sb-https.rule: >-
        Host(`${API_HOST}`) && (PathPrefix(`/rest/v1`) || PathPrefix(`/auth/v1`) || PathPrefix(`/storage/v1`))
      traefik.http.routers.craft-sb-https.entrypoints: https
      traefik.http.routers.craft-sb-https.tls: "true"
      traefik.http.routers.craft-sb-https.tls.certresolver: letsencrypt
      traefik.http.routers.craft-sb-https.service: craft-sb
      traefik.http.routers.craft-sb-http.rule: Host(`${API_HOST}`)
      traefik.http.routers.craft-sb-http.entrypoints: http
      traefik.http.routers.craft-sb-http.middlewares: craft-sb-to-https
      traefik.http.routers.craft-sb-http.service: craft-sb
      traefik.http.middlewares.craft-sb-to-https.redirectscheme.scheme: https
      traefik.http.middlewares.craft-sb-to-https.redirectscheme.permanent: "true"
      traefik.http.services.craft-sb.loadbalancer.server.port: "8000"

  auth:
    <<: *defaults
    container_name: craft-sb-auth
    image: supabase/gotrue:v2.197.0
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      mail-templates:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: https://craft.ocardoso.com/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "6"
      # Sign-in is a code sent by e-mail: same settings as the cloud project (supabase/config.toml in craft).
      GOTRUE_SMTP_ADMIN_EMAIL: acesso@craft.ocardoso.com
      GOTRUE_SMTP_HOST: smtp.resend.com
      GOTRUE_SMTP_PORT: "465"
      GOTRUE_SMTP_USER: resend
      GOTRUE_SMTP_PASS: ${RESEND_API_KEY}
      GOTRUE_SMTP_SENDER_NAME: Craft
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "${RATE_LIMIT_EMAIL_SENT}"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_OTP_EXP: "600"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "{{ .Token }} é seu código de acesso ao Craft"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "{{ .Token }} é seu código de acesso ao Craft"
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://mail-templates/codigo.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://mail-templates/codigo.html
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

  rest:
    <<: *defaults
    container_name: craft-sb-rest
    image: postgrest/postgrest:v14.18
    mem_limit: 128m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH}
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  storage:
    <<: *defaults
    container_name: craft-sb-storage
    image: supabase/storage-api:v1.89.12
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - ./volumes/storage:/var/lib/storage:z

  db:
    <<: *defaults
    container_name: craft-sb-db
    image: supabase/postgres:17.6.1.136
    mem_limit: 512m
    shm_size: 128m
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      - ./volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_EXP: ${JWT_EXPIRY}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  # GoTrue reads e-mail templates over HTTP.
  mail-templates:
    <<: *defaults
    container_name: craft-sb-templates
    image: nginx:1.29.3-alpine
    mem_limit: 32m
    volumes:
      - ./volumes/templates:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/codigo.html"]
      interval: 5s
      timeout: 5s
      retries: 3

networks:
  coolify:
    external: true

volumes:
  db-config:
